# ResourceQuota — dev
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-dev
  namespace: dev
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "1000m"
    limits.memory: "1Gi"
    pods: "10"
    services: "5"
    persistentvolumeclaims: "5"
---
# ResourceQuota — homologacao (hk)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-hk
  namespace: hk
spec:
  hard:
    requests.cpu: "1000m"
    requests.memory: "1Gi"
    limits.cpu: "2000m"
    limits.memory: "2Gi"
    pods: "20"
    services: "10"
    persistentvolumeclaims: "10"
---
# ResourceQuota — producao (prod)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-prod
  namespace: prod
spec:
  hard:
    requests.cpu: "2000m"
    requests.memory: "2Gi"
    limits.cpu: "4000m"
    limits.memory: "4Gi"
    pods: "50"
    services: "20"
    persistentvolumeclaims: "20"
